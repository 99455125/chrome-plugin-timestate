<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日报工时统计</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <section class="card">
        <h1>日报工时统计</h1>
        <p class="meta">AUTHOR HXY · power by codex</p>
        <p class="hint">用于快速统计上月整月、当月截至今日工时，并支持页面悬浮窗快捷操作。</p>
        <div class="actions">
          <button id="lastMonthButton" class="primary" type="button">上月工时</button>
          <button id="currentMonthButton" class="secondary" type="button">当月工时</button>
          <button id="openPanelButton" class="ghost" type="button">嵌入网页</button>
        </div>
        <p id="status" class="status">等待执行</p>
      </section>

      <section class="card result-card">
        <h2>统计结果</h2>
        <dl id="result" class="result empty">
          <div class="row">
            <dt>时间范围</dt>
            <dd>暂无</dd>
          </div>
          <div class="row">
            <dt>总工时</dt>
            <dd>--</dd>
          </div>
          <div class="row">
            <dt>出勤天数</dt>
            <dd>--</dd>
          </div>
          <div class="row">
            <dt>记录条数</dt>
            <dd>--</dd>
          </div>
          <div class="row">
            <dt>统计时间</dt>
            <dd>--</dd>
          </div>
        </dl>
      </section>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
