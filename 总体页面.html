			function nav_restore(){
				$(".content-page").css({left: "220px"});					
					$(".nav-left").css({width: "220px"});					
					$(".nav-right").css({"padding-left": "220px"});		
					$(".content-page").css({"top": "120px"});		
					$("#logo").attr('src','./images/shie-logo-mini.png');		
					$("#logo").attr('width','80%');	
					$("#homepage_menu").show();
					$("#contract_menu").show();

			function nav_collapse(){
				$(".content-page").css({left: "50px"});					
					$(".nav-left").css({width: "50px"});					
					$(".nav-right").css({"padding-left": "50px"});		
					$(".content-page").css({"top": "0px"});	
					$("#logo").attr('src','./images/shie-logo-square.png');		
					$("#logo").attr('width','100%');	
					$("#homepage_menu").hide();
					$("#contract_menu").hide();
					$("#finance_menu").hide();
					$("#daily_menu").hide();
					$("#admin_menu").hide();
					$("#user_menu").hide();
					$("#nav-top").hide();
					//$("#portal_menu").html("<button type='button' id='extend_btn' onclick='nav_restore()' class='btn btn-default btn-sm'>></button>");
					$("#portal_menu").html("<div id='extend_btn' onclick='nav_restore()' style='display: inline-block; padding: 12px 15px 12px 18px;'><i class='fa-solid fa-arrow-right'></i></div>");
					$.cookie("menu_style","short");

			}
			function nav_show(){
				$(".content-page").css({left: "220px"});					
					$(".nav-left").css({width: "220px"});					
					$(".nav-right").css({"padding-left": "220px"});		
					//$(".content-page").css({"top": "120px"});		
					$("#logo").attr('src','./images/gmp.png');		
					$("#logo").attr('width','80%');	
					$("#homepage_menu").show();
					$("#contract_menu").show();
					$("#finance_menu").show();
					$("#daily_menu").show();
					$("#user_menu").show();
					$("#nav-top").show();
					//$("#portal_menu").html("<button type='button' id='extend_btn' onclick='nav_collapse()' class='btn btn-default btn-sm'><</button>");
					$("#portal_menu").html("<div id='collapse_btn' onclick='nav_collapse()' style='display: inline-block; padding: 12px 15px 12px 18px;'><i class='fa-solid fa-arrow-left'></i></div>");	
			}

			function set_iframe_cookie(url) {
				console.log("url is:" + url);
				$.cookie("iframe_page",url);
			}

			$(function () {
				console.log("from homepage.");	
				console.log("menu_style is: "+$.cookie("menu_style"));
				console.log("iframe page is: "+$.cookie("iframe_page"));
				if ($.cookie("menu_style")=="short") {
					console.log("menu style is short.");
					nav_collapse();
				}

				if ($.cookie("iframe_page")!=null) {
					console.log("setting mainframe to:" + $.cookie("iframe_page"));
					$("#mainframe").attr('src',$.cookie("iframe_page"));
				} else {
					$("#mainframe").attr('src',"/home/index.jsp");
				}

				$("#collapse_btn").click(function () {
					console.log("click collapse_btn menu.");
					nav_collapse();
	
				});
				$("#extend_btn").click(function () {
					console.log("click extend_btn menu.");
					nav_restore();
				});

				$("[id='update_password']").click(function () {
                var usr=$(this).parent().children()[0].value;
                console.log('./user_update_dialog.jsp?no=' + usr);
					BootstrapDialog.show({
						title: '域密码更新【' + usr + '】',
						message: $('<div></div>').load('https://password.shie.com.cn/iisadmpwd/'),
						type: BootstrapDialog.TYPE_PRIMARY, // <-- Default value is BootstrapDialog.TYPE_PRIMARY
						size: BootstrapDialog.SIZE_NORMAL,
						buttons: [
						{
								label: '关闭',
								action: function (dialogItself) {
									dialogItself.close();
								}
							}
						]
					});
            	});

        		$("#update_myself").click(function () {
					//var usr=$(this).parent().children()[0].value;
					//console.log('./user_update_dialog.jsp?no=' + usr);
					BootstrapDialog.show({
						title: '信息更新',
						message: $('<div></div>').load('/admin/my_update_dialog.jsp'),
						type: BootstrapDialog.TYPE_PRIMARY, // <-- Default value is BootstrapDialog.TYPE_PRIMARY
						size: BootstrapDialog.SIZE_NORMAL,
						buttons: [
						{
								label: '关闭',
								action: function (dialogItself) {
									dialogItself.close();
								}
							}, 
							{
								label: '提交',
								cssClass: 'btn-primary',
								action: function (dialogItself) {
									$.post("/admin/my_update_dialog_do.jsp", {
										is_support: $("#d_is_support").val(),
										support_type: $("#d_support_type").val(),
										project_name: $("#d_project_name").val(),
										okd_pwd: $("#d_okd_pwd").val(),
										phone: $("#d_phone").val(),
										user_name: $("#d_user_name").val()
									}, function (data, textStatus) {
										if (data.trim() != "") {
											toastr.info("【" + $("#d_user_name").val() + "】用户信息已更新！" + data.trim());
											dialogItself.close();
											location.reload();
										}
									});
								}
							}
						]
					});
           		 });
			});

		<script type="text/javascript">
			$(function() {
				let navflag = false;
				$('.nav-tab').click(function() {
					$(this).siblings().each(function() {
						$(this).removeClass('a_active');
						// $(this).removeClass('a_active');
						$(this).find('.nav-box').css('height', '0')
						//关闭右侧箭头
						if ($(this).attr('class').indexOf('nav-ul') != -1) {
							$(this).find('.bx-chevron-right').css('transform', 'rotateZ(0deg)')
							$(this).find('.bx-chevron-right').css('transition', 'all .5s')
							$(this).removeClass('nav-show')
							// $(this).find('div').removeClass('nav-box')
						}
					})
					//当前选中
					$(this).addClass('a_active')
					$(this).find('.li-a').addClass('active')
					// 打开右侧箭头
					$(this).find('.bx-chevron-right').css('transform', 'rotateZ(90deg)')
					$(this).find('.bx-chevron-right').css('transition', 'all .5s')
					$(this).addClass('nav-show')
					// $(this).find('div').addClass('nav-box')
				})
				/* 二级菜单a点击事件 */
				$(".li-a-a").click(function() {
					$(".li-a-a").each(function() {
						$(this).removeClass('active-li-a');
					})
					$(this).addClass('active-li-a');
				})
			})
